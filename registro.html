<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conecta Hogar - Registro</title>
    <link rel="stylesheet" href="registro.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <div class="container">

        <a href="index.html" class="volver">
            <i class="fa-solid fa-arrow-left"></i>
            Volver al inicio
        </a>

        <h1>Únete a Conecta Hogar</h1>
        <p class="subtitulo">
            Completa tus datos para registrarte en nuestra plataforma
        </p>

        <div class="card">

          <form id="registro">
            <!-- Nombre -->
            <div class="grupo">
                <label>
                    <i class="fa-regular fa-user"></i>
                    Nombre completo
                </label>
                <input type="text" 
                    id="nombre" 
                    placeholder="Ej: Juan Pérez González" 
                    required>
                    <span class="error" id="errorNombre"></span>
            </div>

            <!-- RUT -->
            <div class="grupo">
                <label>
                    <i class="fa-regular fa-id-card"></i>
                    RUT
                </label>
                <input type="text" 
                    id="rut" 
                    placeholder="Ej: 12.345.678-9" 
                    required>
            </div>

            <!-- Correo -->
            <div class="grupo">
                <label>
                    <i class="fa-regular fa-envelope"></i>
                    Correo electrónico
                </label>
                <input type="email"
                    id="correo"
                    placeholder="Ej: juan@gmail.com"
                    required>
            </div>

            <!-- Dirección -->
            <div class="grupo">
                <label>
                    <i class="fa-solid fa-location-dot"></i>
                    Dirección
                </label>
                <input type="text"
                    id="direccion"
                    placeholder="Ej: Av. O'Higgins 123"
                    required>
            </div>

            <hr>

            <!-- Tipo usuario -->
            <h3>Tipo de usuario</h3>

            <div class="tipos">

                <div class="tipo-card" id="cliente">
                    <input type="radio" name="tipo" value="cliente">

                    <div>
                        <h4>Cliente</h4>
                        <p>Busco contratar servicios</p>
                    </div>
                </div>

                <div class="tipo-card" id="profesional">
                    <input type="radio" name="tipo" value="profesional">

                    <div>
                        <h4>Profesional</h4>
                        <p>Ofrezco servicios</p>
                    </div>
                </div>

            </div>

            <!-- Especialidades -->
            <div id="especialidades">

                <hr>

                <h3>Especialidades</h3>
                <p>Selecciona todas las que apliquen</p>

                <div class="especialidades-grid">

                    <label class="especialidad">
                        <input type="checkbox">
                        Gasfitería
                    </label>

                    <label class="especialidad">
                        <input type="checkbox">
                        Electricidad
                    </label>

                    <label class="especialidad">
                        <input type="checkbox">
                        Albañilería
                    </label>

                    <label class="especialidad">
                        <input type="checkbox">
                        Control de Plagas
                    </label>

                    <label class="especialidad">
                        <input type="checkbox">
                        Carpintería
                    </label>

                    <label class="especialidad">
                        <input type="checkbox">
                        Techado
                    </label>

                    <label class="especialidad">
                        <input type="checkbox">
                        Pintura
                    </label>

                    <label class="especialidad">
                        <input type="checkbox">
                        Cerrajería
                    </label>

                </div>

            </div>

            <button class="btn">
                Registrar
            </button>

          </form>

            <p class="terminos">
                Al registrarte, aceptas nuestros
                <a href="#">Términos y Condiciones</a>
            </p>

        </div>
    </div>

    <script src="registro.js"></script>

</body>

</html>
